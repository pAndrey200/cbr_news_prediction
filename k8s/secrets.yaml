apiVersion: v1
kind: Secret
metadata:
  name: cbr-db-secret
  namespace: cbr-news
type: Opaque
stringData:
  POSTGRES_USER: cbr_user
  POSTGRES_PASSWORD: cbr_password
  POSTGRES_DB: cbr_news
---
apiVersion: v1
kind: Secret
metadata:
  name: cbr-telegram-secret
  namespace: cbr-news
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE_WITH_YOUR_TOKEN"
