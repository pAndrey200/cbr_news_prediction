apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cbr-news
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: cbr-news:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cbr-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cbr-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cbr-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cbr-db-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 6Gi
              cpu: 2000m
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: cbr-checkpoints-pvc
            readOnly: true
        - name: data
          persistentVolumeClaim:
            claimName: cbr-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cbr-news
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
