defaults:
  - _self_

data:
  run_parser: false
  parser:
    timeout: 10
    delay_between_requests: 0.5
    max_press_releases: 10000
  dataset_path: "data/cbr_news.csv"
  dvc:
    enabled: true
    remote:
      name: "s3remote"
      url: "s3://potseluevam/"
      region_name: "ru-central1"
      endpoint_url: "https://storage.yandexcloud.net/"
  max_length: 256  # Было: 512 → короткие последовательности меньше переобучаются
  batch_size: 32   # Было: 16 → больше батч = стабильнее градиенты
  test_size: 0.2
  val_size: 0.1
  prediction_horizon: 2
  ruonia_threshold: 0.02

  # Combined dataset (CBR press releases + news_collection.parquet)
  # Regenerate with: python cbr_news/ml/prepare_news_dataset.py
  multitask_dataset_path: "data/cbr_combined_dataset.csv"

  # Temporal split: train on 2013-2022, val on 2023, test on 2024+
  # 2024 is the last year in the new dataset; 2025-2026 come from CBR releases only
  train_years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
  val_years: [2023]
  test_years: [2024, 2025, 2026]

  tokenizer_name: "DeepPavlov/rubert-base-cased"

  classes:
    - down
    - same
    - up